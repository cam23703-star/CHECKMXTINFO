<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHECKMXTINFO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #09050f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background-image: radial-gradient(ellipse at 50% 0%, #1a0e2e 0%, #09050f 70%);
        }

        .container {
            background: #0f0b1a;
            border-radius: 32px;
            padding: 32px 30px;
            max-width: 860px;
            width: 100%;
            border: 1px solid #2a1a44;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 0 1px #3a225a inset, 0 0 80px rgba(120, 50, 200, 0.06);
            backdrop-filter: blur(2px);
            transition: all 0.3s ease;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f1235;
            padding-bottom: 16px;
            margin-bottom: 22px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo {
            color: #c4a0f0;
            font-weight: 700;
            font-size: 24px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #7c3aed, #4c1d95);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 800;
            color: #fff;
        }

        .logo span {
            color: #7c3aed;
        }

        .header-menu {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .header-menu a {
            color: #6a528a;
            font-size: 13px;
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 30px;
            transition: 0.25s;
            cursor: pointer;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .header-menu a:hover {
            color: #c4a0f0;
            background: #1a0e2e;
        }

        .header-menu a.logout {
            color: #b05a6a;
        }

        .header-menu a.logout:hover {
            background: #2a1220;
            color: #f28b9c;
        }

        /* INPUT */
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .input-group input {
            flex: 2;
            min-width: 200px;
            padding: 16px 22px;
            border-radius: 60px;
            border: none;
            background: #0a0715;
            color: #e0d0f0;
            font-size: 15px;
            outline: 2px solid #22153a;
            transition: 0.3s;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .input-group input::placeholder {
            color: #4a3a5e;
            font-weight: 300;
        }

        .input-group input:focus {
            outline: 2px solid #7c3aed;
            background: #0f0b1a;
            box-shadow: 0 0 30px rgba(124, 58, 237, 0.08);
        }

        .input-group button {
            padding: 16px 34px;
            border-radius: 60px;
            border: none;
            background: linear-gradient(135deg, #7c3aed, #4c1d95);
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .input-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(124, 58, 237, 0.45);
            background: linear-gradient(135deg, #8b5cf6, #5b21b6);
        }

        .input-group button:active {
            transform: scale(0.96);
        }

        /* LOADING */
        #loading {
            display: none;
            text-align: center;
            padding: 24px 0 12px;
            color: #8a72aa;
            font-weight: 300;
            letter-spacing: 2px;
            font-size: 14px;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #1f1235;
            border-top: 3px solid #7c3aed;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 14px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* RESULT */
        #result {
            display: none;
            margin-top: 8px;
            animation: fadeUp 0.45s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* PROFILE CARD */
        .profile-card {
            background: #0a0715;
            border-radius: 20px;
            padding: 24px 24px;
            display: flex;
            gap: 24px;
            border: 1px solid #1f1235;
            margin-bottom: 18px;
            flex-wrap: wrap;
            transition: 0.3s;
        }

        .profile-card:hover {
            border-color: #2a1a44;
        }

        .avatar-area {
            flex-shrink: 0;
        }

        .avatar-area img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #3a225a;
            object-fit: cover;
            background: #0a0715;
            transition: 0.3s;
        }

        .avatar-area img:hover {
            border-color: #7c3aed;
            box-shadow: 0 0 30px rgba(124, 58, 237, 0.15);
        }

        .profile-info {
            flex: 1;
            color: #b09ac8;
            font-size: 14px;
            line-height: 1.9;
            min-width: 220px;
        }

        .player-name {
            font-size: 26px;
            font-weight: 700;
            color: #e8daf8;
            letter-spacing: 0.3px;
            margin-bottom: 2px;
        }

        .player-uid {
            color: #6a528a;
            font-size: 13px;
            font-weight: 400;
            margin-bottom: 4px;
        }

        .player-rank-level {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #120b20;
            padding: 2px 16px 2px 14px;
            border-radius: 30px;
            margin: 4px 0 6px;
            border: 1px solid #1f1235;
        }

        .rank {
            color: #fbbf24;
            font-weight: 600;
            font-size: 14px;
        }

        .level {
            color: #8a72aa;
            font-weight: 500;
            font-size: 13px;
        }

        .separator-dot {
            color: #3a225a;
        }

        .player-region,
        .player-guild {
            color: #7a629a;
            font-size: 13px;
        }

        .player-exp,
        .player-like,
        .player-created,
        .player-lastlogin {
            color: #8a72aa;
            font-size: 13px;
            display: inline-block;
            margin-right: 16px;
        }

        .stat-group {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 18px;
            margin-top: 4px;
            padding-top: 6px;
            border-top: 1px solid #120b20;
        }

        .stat-item {
            color: #8a72aa;
            font-size: 13px;
        }

        .stat-item strong {
            color: #c4a0f0;
            font-weight: 500;
        }

        /* DETAIL SECTION */
        .detail-section {
            background: #0a0715;
            border-radius: 20px;
            padding: 18px 22px 16px;
            border: 1px solid #1f1235;
            transition: 0.3s;
        }

        .detail-section:hover {
            border-color: #2a1a44;
        }

        .section-title {
            color: #c4a0f0;
            font-weight: 600;
            font-size: 15px;
            border-bottom: 1px solid #120b20;
            padding-bottom: 10px;
            margin-bottom: 14px;
            letter-spacing: 0.8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title .sub {
            color: #6a528a;
            font-weight: 300;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px 24px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 7px 0;
            border-bottom: 1px solid #0f0b1a;
            font-size: 13px;
            align-items: center;
        }

        .detail-row .label {
            color: #6a528a;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        .detail-row .value {
            color: #d8c8ee;
            font-weight: 400;
            text-align: right;
            max-width: 62%;
            word-break: break-word;
        }

        /* ACTION MENU */
        .action-menu {
            display: flex;
            gap: 8px;
            margin-top: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .menu-btn {
            background: transparent;
            border: 1px solid #22153a;
            color: #6a528a;
            padding: 8px 28px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: 0.25s;
            letter-spacing: 0.5px;
        }

        .menu-btn.active {
            background: linear-gradient(135deg, #7c3aed, #4c1d95);
            border-color: #7c3aed;
            color: #fff;
            box-shadow: 0 4px 24px rgba(124, 58, 237, 0.25);
        }

        .menu-btn:hover {
            background: #1a0e2e;
            color: #c4a0f0;
            border-color: #3a225a;
        }

        .menu-btn.active:hover {
            background: linear-gradient(135deg, #8b5cf6, #5b21b6);
        }

        /* ERROR */
        .error-msg {
            color: #f28b9c;
            text-align: center;
            padding: 14px;
            background: #1a0a18;
            border-radius: 16px;
            border: 1px solid #3a1a28;
            font-size: 14px;
            letter-spacing: 0.3px;
        }

        /* FOOTER */
        .footer {
            margin-top: 22px;
            color: #3a2a52;
            font-size: 11px;
            text-align: center;
            letter-spacing: 0.8px;
            border-top: 1px solid #120b20;
            padding-top: 18px;
        }

        .footer a {
            color: #5a427a;
            text-decoration: none;
            transition: 0.2s;
        }

        .footer a:hover {
            color: #8a72aa;
        }

        /* RESPONSIVE */
        @media (max-width: 640px) {
            .container {
                padding: 20px 16px;
            }

            .logo {
                font-size: 20px;
            }

            .logo-icon {
                width: 30px;
                height: 30px;
                font-size: 14px;
            }

            .profile-card {
                padding: 16px;
                gap: 16px;
            }

            .avatar-area img {
                width: 80px;
                height: 80px;
            }

            .player-name {
                font-size: 20px;
            }

            .detail-grid {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .input-group button {
                width: 100%;
                justify-content: center;
            }

            .input-group input {
                min-width: 100%;
            }

            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }

            .header-menu {
                justify-content: flex-start;
                gap: 4px;
            }

            .header-menu a {
                padding: 4px 12px;
                font-size: 12px;
            }

            .player-exp,
            .player-like,
            .player-created,
            .player-lastlogin {
                display: block;
                margin-right: 0;
            }

            .stat-group {
                flex-direction: column;
                gap: 2px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 14px 12px;
                border-radius: 24px;
            }

            .profile-card {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .player-rank-level {
                justify-content: center;
            }

            .detail-row {
                font-size: 12px;
                padding: 5px 0;
            }

            .menu-btn {
                padding: 6px 18px;
                font-size: 12px;
            }
        }

        /* SCROLL BAR */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0715;
        }

        ::-webkit-scrollbar-thumb {
            background: #2a1a44;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3a225a;
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <div class="logo">
                <div class="logo-icon">M</div>
                CHECK<span>MXT</span>INFO
            </div>
            <div class="header-menu">
                <a>BANG GIA</a>
                <a>NAP THE</a>
                <a class="logout">THOAT</a>
            </div>
        </div>

        <!-- INPUT -->
        <div class="input-group">
            <input type="text" id="uidInput" placeholder="Nhap UID FreeFire ..." autofocus>
            <button id="checkBtn">TRA CUU</button>
        </div>

        <!-- LOADING -->
        <div id="loading">
            <span class="spinner"></span> DANG TAI DU LIEU ...
        </div>

        <!-- RESULT -->
        <div id="result">

            <!-- PROFILE CARD -->
            <div class="profile-card">
                <div class="avatar-area">
                    <img id="userAvatar" src="" alt="avatar" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22110%22 height=%22110%22%3E%3Crect width=%22110%22 height=%22110%22 fill=%22120b20%22/%3E%3Ctext x=%2255%22 y=%2260%22 text-anchor=%22middle%22 fill=%22%236a528a%22 font-size=%2240%22 font-weight=%22300%22%3E%3F%3C/text%3E%3C/svg%3E';">>
                </div>
                <div class="profile-info">
                    <div class="player-name" id="playerName">-</div>
                    <div class="player-uid" id="playerUid">UID: -</div>
                    <div class="player-rank-level">
                        <span class="rank" id="playerRank">-</span>
                        <span class="separator-dot">•</span>
                        <span class="level" id="playerLevel">LV.-</span>
                    </div>
                    <div class="player-region" id="playerRegion">Khu vuc: -</div>
                    <div class="player-guild" id="playerGuild">Guild: -</div>
                    <div class="stat-group">
                        <span class="stat-item"><strong id="playerExp">-</strong> EXP</span>
                        <span class="stat-item"><strong id="playerLike">-</strong> LIKE</span>
                        <span class="stat-item" id="playerCreated">Tao acc: -</span>
                        <span class="stat-item" id="playerLastLogin">Dang nhap cuoi: -</span>
                    </div>
                </div>
            </div>

            <!-- DETAIL SECTION -->
            <div class="detail-section">
                <div class="section-title">
                    <span>THONG TIN CHI TIET</span>
                    <span class="sub" id="creditDisplay">Credit: -</span>
                </div>
                <div class="detail-grid" id="detailGrid"></div>
            </div>

            <!-- ACTION MENU -->
            <div class="action-menu">
                <button class="menu-btn active">Thong tin</button>
                <button class="menu-btn">Cong cu</button>
                <button class="menu-btn">Ho tro Zalo</button>
            </div>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            DU LIEU TU CHECKFF.NET · PROXY LOCAL ·
            <a href="https://github.com/yourusername/ff-checker" target="_blank">GITHUB</a>
        </div>

    </div>

    <script>
        (function() {
            const uidInput = document.getElementById('uidInput');
            const checkBtn = document.getElementById('checkBtn');
            const loading = document.getElementById('loading');
            const resultDiv = document.getElementById('result');

            const userAvatar = document.getElementById('userAvatar');
            const playerName = document.getElementById('playerName');
            const playerUid = document.getElementById('playerUid');
            const playerRank = document.getElementById('playerRank');
            const playerLevel = document.getElementById('playerLevel');
            const playerRegion = document.getElementById('playerRegion');
            const playerGuild = document.getElementById('playerGuild');
            const playerExp = document.getElementById('playerExp');
            const playerLike = document.getElementById('playerLike');
            const playerCreated = document.getElementById('playerCreated');
            const playerLastLogin = document.getElementById('playerLastLogin');
            const detailGrid = document.getElementById('detailGrid');
            const creditDisplay = document.getElementById('creditDisplay');

            function showError(msg) {
                resultDiv.style.display = 'block';
                detailGrid.innerHTML = '<div class="error-msg">' + msg + '</div>';
                playerName.textContent = '-';
                playerUid.textContent = 'UID: -';
                playerRank.textContent = '-';
                playerLevel.textContent = 'LV.-';
                playerRegion.textContent = 'Khu vuc: -';
                playerGuild.textContent = 'Guild: -';
                playerExp.textContent = '-';
                playerLike.textContent = '-';
                playerCreated.textContent = 'Tao acc: -';
                playerLastLogin.textContent = 'Dang nhap cuoi: -';
                userAvatar.src = '';
                creditDisplay.textContent = 'Credit: -';
            }

            function formatDate(str) {
                if (!str) return '-';
                try {
                    const d = new Date(str);
                    if (isNaN(d)) return str;
                    return d.toLocaleDateString('vi-VN') + ' ' + d.toLocaleTimeString('vi-VN', { hour: '2-digit',
                        minute: '2-digit' });
                } catch {
                    return str;
                }
            }

            function renderAll(data) {
                if (!data || typeof data !== 'object') {
                    showError('Du lieu trong.');
                    return;
                }
                if (data.error || data.status === false) {
                    showError(data.message || data.error || 'UID khong hop le.');
                    return;
                }

                userAvatar.src = data.avatar || data.avatar_url || '';
                playerName.textContent = data.name || data.nickname || 'Khong co ten';
                playerUid.textContent = 'UID: ' + (data.uid || 'N/A');
                playerRank.textContent = data.rank || data.rank_name || 'N/A';
                playerLevel.textContent = 'LV.' + (data.level || '?');
                playerRegion.textContent = 'Khu vuc: ' + (data.region || data.country || 'N/A');
                playerGuild.textContent = 'Guild: ' + (data.clan?.name || data.guild || '-');
                playerExp.textContent = data.exp ? data.exp.toLocaleString() : (data.experience || '0');
                playerLike.textContent = data.like || data.likes || '0';
                playerCreated.textContent = 'Tao acc: ' + formatDate(data.created || data.created_at);
                playerLastLogin.textContent = 'Dang nhap cuoi: ' + formatDate(data.last_login || data.lastLogin);
                creditDisplay.textContent = 'Credit: ' + (data.credit_score || data.credit || '-');

                const detailMap = {
                    'Ten HD': data.name || data.nickname || '-',
                    'UID': data.uid || '-',
                    'Cap do': data.level || '-',
                    'Hang': data.rank || data.rank_name || '-',
                    'Guild': data.clan?.name || data.guild || '-',
                    'Credit Score': data.credit_score || data.credit || '-',
                    'Mail xac thuc': data.email_verified ? 'Da xac thuc' : 'Chua xac thuc',
                    'Mail dang gan': data.email || '-',
                    'Thoi gian gan': formatDate(data.email_verified_at || data.email_verified_time),
                    'Lien ket': (function() {
                        let s = [];
                        if (data.facebook) s.push('Facebook');
                        if (data.google) s.push('Google');
                        if (data.apple) s.push('Apple');
                        if (data.zalo) s.push('Zalo');
                        return s.length ? s.join(', ') : '-';
                    })()
                };

                const extraFields = ['kd', 'match', 'win', 'top10', 'headshot', 'playtime', 'vip_level', 'diamond',
                    'gold', 'device', 'os_version', 'season', 'season_rank', 'banned', 'reported'
                ];
                extraFields.forEach(function(key) {
                    if (data[key] !== undefined && data[key] !== null && data[key] !== '') {
                        var label = key.replace(/_/g, ' ').replace(/\b\w/g, function(l) { return l.toUpperCase(); });
                        detailMap[label] = String(data[key]);
                    }
                });

                var html = '';
                for (var key in detailMap) {
                    if (detailMap.hasOwnProperty(key)) {
                        var value = detailMap[key];
                        if (value === null || value === undefined || value === '') value = '-';
                        html += '<div class="detail-row"><span class="label">' + key + '</span><span class="value">' +
                            value + '</span></div>';
                    }
                }
                detailGrid.innerHTML = html;
                resultDiv.style.display = 'block';
            }

            async function fetchFromBackend(uid) {
                var resp = await fetch('/api/ff/' + uid, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });
                if (!resp.ok) {
                    var err = await resp.json().catch(function() { return {}; });
                    throw new Error(err.error || err.detail || 'HTTP ' + resp.status);
                }
                return await resp.json();
            }

            async function handleCheck() {
                var uid = uidInput.value.trim();
                if (!uid) {
                    showError('Nhap UID.');
                    return;
                }
                resultDiv.style.display = 'none';
                loading.style.display = 'block';
                try {
                    var data = await fetchFromBackend(uid);
                    renderAll(data);
                } catch (err) {
                    showError('Loi: ' + (err.message || 'khong xac dinh'));
                } finally {
                    loading.style.display = 'none';
                }
            }

            checkBtn.addEventListener('click', handleCheck);
            uidInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') handleCheck();
            });

            // Auto focus
            uidInput.focus();
        })();
    </script>
</body>
  </html>
